name: conventional-commits

on:
  pull_request:
    branches: [skyblue/v1]
  push:
    branches: [skyblue/v1]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install -r requirements-dev.txt

      - name: Check commit messages
        run: |
          set -euo pipefail
          BASE="$(cat .version)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="${BASE}..${AFTER}"
            else
              RANGE="${BEFORE}..${AFTER}"
            fi
          fi
          # Only commits after the upstream pin
          mapfile -t COMMITS < <(git rev-list --reverse "$RANGE" 2>/dev/null || true)
          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "No commits in range $RANGE"
            exit 0
          fi
          FAILED=0
          for c in "${COMMITS[@]}"; do
            if git merge-base --is-ancestor "$c" "$BASE" 2>/dev/null; then
              continue
            fi
            TMP=$(mktemp)
            git log -1 --format=%B "$c" >"$TMP"
            if ! cz check --commit-msg-file "$TMP"; then
              echo "Non-conventional: $c"
              FAILED=1
            fi
            rm -f "$TMP"
          done
          exit "$FAILED"
