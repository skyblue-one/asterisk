name: release

on:
  push:
    branches: [skyblue/v1]

concurrency:
  group: release-skyblue-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: cz
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: skyblue/v1
          changelog: "true"
          no_raise: "3,17,21"
          git_name: github-actions[bot]
          git_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: GitHub Release
        if: steps.cz.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.cz.outputs.version }}"
          TAG="v${VERSION}"
          # Only publish when this job just landed the SemVer tag on HEAD.
          if ! git describe --exact-match --tags HEAD 2>/dev/null | grep -qx "$TAG"; then
            echo "skip: HEAD is not ${TAG}"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip: ${TAG} release already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
