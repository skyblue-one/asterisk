name: upstream-probe

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: skyblue/v1

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/asterisk/asterisk.git 2>/dev/null || true
          git fetch upstream --tags

      - name: Resolve latest certified on series
        id: tag
        run: |
          set -euo pipefail
          BASE="$(tr -d '[:space:]' < .version)"
          # certified-22.8-cert4 -> certified-22.8-cert*
          PREFIX="${BASE%-cert*}-cert"
          LATEST="$(git tag -l "${PREFIX}*" | grep -Ev '(rc|pre|alpha|beta)' | sort -V | tail -1)"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST" ] || [ "$LATEST" = "$BASE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto probe branch
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "skyblue-ci"
          git config user.email "ci@skyblue.local"
          BASE="${{ steps.tag.outputs.base }}"
          LATEST="${{ steps.tag.outputs.latest }}"
          git checkout -B "probe/${LATEST}"
          git rebase --onto "$LATEST" "$BASE"

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential autoconf libxml2-dev libncurses-dev \
            libsqlite3-dev libssl-dev uuid-dev libjansson-dev libedit-dev >/dev/null
          ./configure
          make -j"$(nproc)"

      - name: Open issue on failure
        if: failure() && steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream-probe --description "Certified upstream probe failed" --color B60205 2>/dev/null || true
          TITLE="Upstream probe failed: ${{ steps.tag.outputs.latest }}"
          COUNT=$(gh issue list --label upstream-probe --state open --search "in:title ${TITLE}" --json number --jq 'length')
          if [ "$COUNT" = "0" ]; then
            gh issue create --title "$TITLE" \
              --label upstream-probe \
              --body "Base \`${{ steps.tag.outputs.base }}\`. Probe of \`${{ steps.tag.outputs.latest }}\` failed. Manual rebase or cherry-pick required. See upstream.md."
          fi
